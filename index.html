<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatVR — Ты в теле кошки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0c0f 0%, #1a1f2a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: rgba(20, 24, 30, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 42px;
            padding: 40px 30px 35px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
            transition: transform 0.2s;
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff, #b0d0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(100, 180, 255, 0.4);
            margin-bottom: 15px;
            line-height: 1.1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        h1 span {
            filter: drop-shadow(0 0 15px #4f9fff);
        }

        .description {
            font-size: 1.4rem;
            font-weight: 400;
            color: #b8c7dd;
            margin-bottom: 28px;
            padding: 0 10px;
            letter-spacing: 0.3px;
            line-height: 1.4;
            border-left: 2px solid #3e6b9c;
            border-right: 2px solid #3e6b9c;
            display: inline-block;
            padding: 8px 24px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
        }

        /* Видео-контейнер */
        .video-wrapper {
            margin: 30px 0 35px;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            background: #000;
            transition: box-shadow 0.3s;
        }

        .video-wrapper:hover {
            box-shadow: 0 20px 40px rgba(0, 120, 255, 0.2), 0 0 0 1px rgba(80, 160, 255, 0.3);
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 360px;
            object-fit: cover;
            background: #111;
        }

        .download-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .download-title {
            font-size: 1.7rem;
            font-weight: 600;
            color: #e0ecff;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 150, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-title::before,
        .download-title::after {
            content: "";
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3f6e9c, transparent);
            min-width: 40px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .btn {
            flex: 1 1 200px;
            min-width: 180px;
            padding: 18px 28px;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            border-radius: 100px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s ease;
            text-decoration: none;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-telegram {
            background: linear-gradient(135deg, #1e88e5, #0b5e9e);
            color: white;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            box-shadow: 0 10px 20px -5px #1e88e580, 0 0 0 1px #3e9eff40;
        }

        .btn-telegram:hover {
            background: linear-gradient(135deg, #2196f3, #0c6eb8);
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 18px 30px -8px #1e88e5, 0 0 0 1px #80bdff;
        }

        .btn-telegram:active {
            transform: scale(0.98);
            box-shadow: 0 5px 12px #0b5e9e;
        }

        .btn-mediafire {
            background: #2a2f3a;
            color: #e0e6f0;
            border: 1px solid #4a5160;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            font-weight: 500;
        }

        .btn-mediafire:hover {
            background: #343b48;
            color: #ffffff;
            border-color: #6b7a90;
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 15px 25px -5px #000000cc, inset 0 1px 3px #ffffff1a;
        }

        .btn-mediafire:active {
            transform: scale(0.98);
            background: #1d222b;
        }

        /* Иконки (эмодзи-заглушки, можно заменить на SVG) */
        .icon {
            font-size: 1.5rem;
            line-height: 1;
            filter: drop-shadow(0 2px 5px black);
        }

        /* Модальное окно (для Mediafire) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-window {
            background: #1d222c;
            border-radius: 42px;
            padding: 40px 45px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px #3a4457;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.2, 1, 0.3, 1);
            border: 1px solid #3e4a5d;
        }

        .modal-overlay.active .modal-window {
            transform: scale(1);
        }

        .modal-window h3 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffcf7a;
            margin-bottom: 12px;
            text-shadow: 0 4px 12px #ffa50040;
            letter-spacing: -0.5px;
        }

        .modal-window p {
            font-size: 1.3rem;
            color: #c0cce0;
            margin-bottom: 28px;
            font-weight: 400;
            background: #2a313e;
            padding: 12px 20px;
            border-radius: 100px;
            display: inline-block;
            border: 1px solid #4a5568;
        }

        .modal-close {
            background: #2e3746;
            border: none;
            color: #eef4ff;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 14px 36px;
            border-radius: 100px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
            border: 1px solid #4c5a70;
            letter-spacing: 0.3px;
        }

        .modal-close:hover {
            background: #3b475c;
            color: white;
            border-color: #7e8fa8;
            transform: scale(1.02);
        }

        .modal-close:active {
            transform: scale(0.96);
        }

        /* Адаптивность */
        @media (max-width: 550px) {
            .card {
                padding: 30px 20px 30px;
                border-radius: 32px;
            }

            h1 {
                font-size: 3.2rem;
            }

            .description {
                font-size: 1.1rem;
                padding: 6px 16px;
            }

            .download-title {
                font-size: 1.4rem;
            }

            .btn {
                font-size: 1.1rem;
                padding: 15px 20px;
                min-width: 150px;
            }

            .modal-window {
                padding: 30px 20px;
            }

            .modal-window h3 {
                font-size: 1.8rem;
            }

            .modal-window p {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 380px) {
            h1 {
                font-size: 2.6rem;
            }
            .buttons {
                gap: 12px;
            }
        }

        /* Кастомный скролл (необязательно) */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1217;
        }
        ::-webkit-scrollbar-thumb {
            background: #3e526b;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Заголовок CatVR -->
    <h1>
        CatVR 
    </h1>

    <!-- Описание -->
    <div class="description">
        Ты в теле кошки в доме бабушки
    </div>

    <!-- Видео -->
    <div class="video-wrapper">
        <video controls autoplay muted loop playsinline poster="">
            <source src="Video.mp4" type="video/mp4">
            Ваш браузер не поддерживает видео. Обновите его.
        </video>
    </div>

    <!-- Блок скачивания -->
    <div class="download-section">
        <div class="download-title">
            Скачать через:
        </div>

        <div class="buttons">
            <!-- Кнопка Telegram (ссылка) -->
            <a href="https://t.me/PhoneXRApk/11" class="btn btn-telegram" target="_blank" rel="noopener noreferrer">
                <span class="icon">📨</span> Telegram
            </a>

            <!-- Кнопка Mediafire (серая) с модальным окном -->
            <button class="btn btn-mediafire" id="mediafireBtn">
                <span class="icon">☁️</span> Mediafire
            </button>
        </div>
    </div>
</div>

<!-- Модальное окно для Mediafire -->
<div class="modal-overlay" id="mediafireModal">
    <div class="modal-window">
        <h3>⏳ Mediafire</h3>
        <p>Mediafire скоро</p>
        <button class="modal-close" id="closeModalBtn">Закрыть</button>
    </div>
</div>

<script>
    (function() {
        const modal = document.getElementById('mediafireModal');
        const mediafireBtn = document.getElementById('mediafireBtn');
        const closeBtn = document.getElementById('closeModalBtn');

        // Открываем модальное окно при клике на Mediafire
        mediafireBtn.addEventListener('click', (e) => {
            e.preventDefault();  // на всякий случай, чтобы не было переходов
            modal.classList.add('active');
        });

        // Закрываем по кнопке "Закрыть"
        closeBtn.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Закрываем по клику на затемнённый фон (оверлей)
        modal.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.classList.remove('active');
            }
        });

        // Закрываем по клавише Escape
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && modal.classList.contains('active')) {
                modal.classList.remove('active');
            }
        });

        // Небольшая проверка на наличие видео (опционально)
        const video = document.querySelector('video');
        if (video) {
            // Если файл не загружается — просто показываем чёрный экран с иконкой, но ничего не делаем.
            video.addEventListener('error', () => {
                console.warn('Видео Video.mp4 не найдено или не поддерживается. Убедитесь, что файл лежит рядом с index.html.');
            });
        }
    })();
</script>

</body>
</html>
